
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up | FitTrack</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">

<nav class="navbar navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand fw-bold" href="index.html">
      <span class="brand-mark">F</span> FitTrack
    </a>
    <a href="index.html" class="btn btn-outline-light btn-sm">
      Back to Home
    </a>
  </div>
</nav>

<main class="auth-wrapper">
  <div class="auth-card">
    <div class="text-center mb-4">
      <span class="auth-icon">F</span>
      <h1 class="h2 fw-bold mt-3">Create your account</h1>
      <p class="text-secondary">Start building healthier habits today.</p>
    </div>

    <form id="signupForm">
      <div class="mb-3">
        <label for="signupName" class="form-label">Full name</label>
        <input type="text" class="form-control" id="signupName"
          placeholder="Enter your name" autocomplete="name"
          maxlength="80" required>
      </div>

      <div class="mb-3">
        <label for="signupEmail" class="form-label">Email address</label>
        <input type="email" class="form-control" id="signupEmail"
          placeholder="you@example.com" autocomplete="email" required>
      </div>

      <div class="mb-3">
        <label for="signupPassword" class="form-label">Password</label>
        <input type="password" class="form-control" id="signupPassword"
          placeholder="At least 8 characters" autocomplete="new-password"
          minlength="8" required>
      </div>

      <div class="mb-3">
        <label for="confirmPassword" class="form-label">
          Confirm password
        </label>
        <input type="password" class="form-control" id="confirmPassword"
          placeholder="Re-enter your password"
          autocomplete="new-password" minlength="8" required>
      </div>

      <div id="signupMessage" class="mb-3" role="status"
        aria-live="polite"></div>

      <button type="submit" class="btn btn-lime w-100 py-2">
        Create Account
      </button>
    </form>

    <p class="text-center mt-4 mb-0">
      Already have an account?
      <a href="login.html" class="auth-link">Login</a>
    </p>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js"></script>
</body>
</html>
